name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

  link-checker:
    name: Link Checker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress './**/*.md'
          fail: true

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run CSpell
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          config: 'cspell.json'
          files: '**/*.md'
          check_dot_files: false
          strict: false

  pr-title-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spec-validator:
    name: Spec Structure Validator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only origin/"$BASE_REF"...HEAD > changed_files.txt
          cat changed_files.txt

      - name: Validate New Specs
        run: |
          #!/bin/bash
          set -e

          # Find all unique feature directories that have changes
          DIRS=$(grep -oE '^[0-9]{3}-[^/]+' changed_files.txt | sort -u || true)

          if [ -z "$DIRS" ]; then
            echo "No feature directories changed."
            exit 0
          fi

          for DIR in $DIRS; do
            echo "Checking directory: $DIR"

            # Check for spec.md
            if [ ! -f "$DIR/spec.md" ]; then
              echo "::error file=$DIR/spec.md::Missing spec.md in $DIR"
              exit 1
            fi

            # Check for requirements checklist
            if [ ! -f "$DIR/checklists/requirements.md" ]; then
              echo "::error file=$DIR/checklists/requirements.md::Missing checklists/requirements.md in $DIR"
              exit 1
            fi

            # Basic content structure check in spec.md
            # Accept either '# Summary' or '# Feature Specification:' as valid top-level headers
            if ! grep -qE "^# (Summary|Feature Specification:)" "$DIR/spec.md"; then
              echo "::error file=$DIR/spec.md::spec.md must contain a '# Summary' or '# Feature Specification:' header"
              exit 1
            fi

            echo "✓ $DIR passed structural validation"
          done
