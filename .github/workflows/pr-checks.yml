name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8 # v16

  link-checker:
    name: Link Checker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress './**/*.md'
          fail: true

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run CSpell
        uses: streetsidesoftware/cspell-action@e464ae97d348eb3beb0c5a6296dc4388ad4484d9 # v6
        with:
          config: 'cspell.json'
          files: '**/*.md'
          check_dot_files: false
          strict: false

  pr-title-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spec-validator:
    name: Spec Structure Validator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only origin/"$BASE_REF"...HEAD > changed_files.txt
          cat changed_files.txt

      - name: Validate New Specs
        run: |
          #!/bin/bash
          set -e

          # Find all unique feature directories that have changes
          DIRS=$(grep -oE '^[0-9]{3}-[^/]+' changed_files.txt | sort -u || true)

          if [ -z "$DIRS" ]; then
            echo "No feature directories changed."
            exit 0
          fi

          for DIR in $DIRS; do
            echo "Checking directory: $DIR"

            # Check for spec.md
            if [ ! -f "$DIR/spec.md" ]; then
              echo "::error file=$DIR/spec.md::Missing spec.md in $DIR"
              exit 1
            fi

            # Check for requirements checklist
            if [ ! -f "$DIR/checklists/requirements.md" ]; then
              echo "::error file=$DIR/checklists/requirements.md::Missing checklists/requirements.md in $DIR"
              exit 1
            fi

            # Basic content structure check in spec.md
            # Accept either '# Summary' or '# Feature Specification:' as valid top-level headers
            if ! grep -qE "^# (Summary|Feature Specification:)" "$DIR/spec.md"; then
              echo "::error file=$DIR/spec.md::spec.md must contain a '# Summary' or '# Feature Specification:' header"
              exit 1
            fi

            echo "✓ $DIR passed structural validation"
          done
