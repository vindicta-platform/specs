name: Spec Analyze Gate

on:
  # No path filter: "Cross-Artifact Consistency Analysis" is a required check, so it must report on
  # every pull request. The detect step runs first and the expensive steps are skipped when no
  # spec.md, plan.md or tasks.md changed.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      feature_dir:
        description: 'Feature directory to analyze (e.g., 044-mcts-foundation)'
        required: true
        type: string

concurrency:
  group: spec-analyze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze:
    name: Cross-Artifact Consistency Analysis
    runs-on: ubuntu-latest
    # Past runs took 8 to 12 minutes. Without a limit a hung run holds the required check for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Detect changed feature dirs
        id: detect
        run: |
          if [ -n "${{ inputs.feature_dir }}" ]; then
            echo "dirs=${{ inputs.feature_dir }}" >> $GITHUB_OUTPUT
          else
            # Only files whose content changed. Whitespace-only and blank-line-only edits (formatting, lint fixes)
            # do not change what a spec says, so they must not trigger an LLM analysis that can block the merge.
            DIRS=$(git diff -w --ignore-blank-lines --no-renames --numstat HEAD~1 HEAD | awk '$1 != "0" || $2 != "0" {print $3}' | grep -E '(^|/)(spec|plan|tasks)\.md$' | xargs -r -I{} dirname {} | sort -u | paste -sd ',' -)
            if [ -z "$DIRS" ]; then
              echo "::notice::No spec artifacts changed"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "dirs=$DIRS" >> $GITHUB_OUTPUT
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: steps.detect.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install Ollama
        if: steps.detect.outputs.skip != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5

      - name: Pull model
        if: steps.detect.outputs.skip != 'true'
        run: |
          MODEL="${SPECKIT_MODEL:-gemma2:2b}"
          echo "Pulling model: $MODEL"
          ollama pull "$MODEL"
        env:
          SPECKIT_MODEL: ${{ vars.SPECKIT_MODEL || 'gemma2:2b' }}

      - name: Install Python dependencies
        if: steps.detect.outputs.skip != 'true'
        run: |
          pip install ollama PyGithub

      - name: Run speckit analyze
        if: steps.detect.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGED_FEATURE_DIRS: ${{ steps.detect.outputs.dirs }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # TEMPORARY (2026-11-11): advisory by default while the pipeline is being unblocked. The analysis still
          # runs, comments and opens issues; it no longer fails the required check. Set the repository variable
          # SPEC_GATE_BLOCKING to 'true' to make it blocking again.
          BLOCK_ON_CRITICAL: ${{ vars.SPEC_GATE_BLOCKING || 'false' }}
          SPECKIT_MODEL: ${{ vars.SPECKIT_MODEL || 'gemma2:2b' }}
        run: |
          python scripts/speckit_analyze.py
