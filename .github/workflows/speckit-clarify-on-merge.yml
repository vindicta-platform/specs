name: Speckit Clarify (Post-Merge)

on:
  push:
    branches:
      - main
    paths:
      - '**/spec.md'
  workflow_dispatch:
    inputs:
      feature_dir:
        description: 'Feature directory to clarify (e.g., 001-ocr-parser). Leave empty for all changed.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clarify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect changed spec files
        id: detect
        run: |
          if [ -n "${{ inputs.feature_dir }}" ]; then
            echo "specs=${{ inputs.feature_dir }}/spec.md" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- '**/spec.md' | tr '\n' ',' | sed 's/,$//')
            echo "specs=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no specs changed
        if: steps.detect.outputs.specs == ''
        run: |
          echo "No spec.md files changed in this push. Skipping."
          exit 0

      - name: Setup Python
        if: steps.detect.outputs.specs != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        if: steps.detect.outputs.specs != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Cache Ollama models
        if: steps.detect.outputs.specs != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-mistral
          restore-keys: |
            ${{ runner.os }}-ollama-

      - name: Start Ollama service
        if: steps.detect.outputs.specs != ''
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull mistral || true

      - name: Run Speckit Clarify
        if: steps.detect.outputs.specs != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_SPECS: ${{ steps.detect.outputs.specs }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          uv run --no-build --with PyGithub --with ollama python scripts/speckit_clarify.py
