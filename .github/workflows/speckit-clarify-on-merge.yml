name: Speckit Clarify (Post-Merge)

on:
  push:
    branches:
      - main
    paths:
      - '**/spec.md'
  workflow_dispatch:
    inputs:
      feature_dir:
        description: 'Feature directory to clarify (e.g., 001-ocr-parser). Leave empty for all changed.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clarify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Detect changed spec files
        id: detect
        run: |
          if [ -n "${{ inputs.feature_dir }}" ]; then
            echo "specs=${{ inputs.feature_dir }}/spec.md" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- '**/spec.md' | tr '\n' ',' | sed 's/,$//')
            echo "specs=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no specs changed
        if: steps.detect.outputs.specs == ''
        run: |
          echo "No spec.md files changed in this push. Skipping."
          exit 0

      - name: Setup Python
        if: steps.detect.outputs.specs != ''
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Setup uv
        if: steps.detect.outputs.specs != ''
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Cache Ollama models
        if: steps.detect.outputs.specs != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-mistral
          restore-keys: |
            ${{ runner.os }}-ollama-

      - name: Start Ollama service
        if: steps.detect.outputs.specs != ''
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull mistral || true

      - name: Run Speckit Clarify
        if: steps.detect.outputs.specs != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_SPECS: ${{ steps.detect.outputs.specs }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          uv run --no-build --with PyGithub --with ollama python scripts/speckit_clarify.py
